version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "image built from Dockerfile"
run:
  command: node dist/index.js
  network:
    port: 3001
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
    - name: AWS_REGION
      value: ap-northeast-1
  # SARVAM_API_KEY, COGNITO_USER_POOL_ID, COGNITO_CLIENT_ID, APP_TABLE_NAME and
  # ALLOWED_ORIGINS are injected as App Runner environment/secret configuration.
  # SARVAM_API_KEY must come from Secrets Manager, never from this file.
